name: Nightly

# Every night on main (owner's decision, 2026-10-18), what pull requests no longer run or never ran:
# - transformer: golden shard 4, the Transformer* classes (default_accurate's encoder on both backends; a pull request
#   runs it only when it touches what they read, see ci.yml's changes job);
# - fuzz: the checkpoint fuzz over every Stanza checkpoint with ten times CI's iterations, and tools/text_fuzz.py
#   (generated texts, Stanza against StanzaSharp; docs/text-fuzzing.md), each night with another seed;
# - benchmark: benchmark.yml's runner matrix in quick mode (no avx512 jobs), for the numbers' trend.
# A failure comments on the open issue "Nightly run failed" (made if there is none); a person closes it once fixed.
# Never a required check; it runs on main's latest commit, so release.yml (which waits for main's push run) never sees it.

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC: 02:00/03:00 in Stockholm
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  transformer:
    uses: ./.github/workflows/ci.yml
    with:
      golden_shards: '[4]'

  fuzz:
    timeout-minutes: 150
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      # The English models from golden's cache (restore only, as ci.yml's docker job does); downloaded on a miss, without
      # the conversion: the checkpoint fuzz then mutates only the .pt files.
      - name: Model cache keys
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release
          tools/ci-models.sh keys

      - uses: actions/cache/restore@v6
        id: models
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      - name: Build
        run: |
          dotnet build StanzaSharp.slnx -c Release
          dotnet build samples/StanzaSharp.Benchmark -c Release

      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: tools/ci-models.sh download en

      # CI runs 300 iterations per fixture and 30 per checkpoint on three small checkpoints with a fixed seed; here 3,000
      # and 300 on every Stanza checkpoint, with the run number as the seed (the report names it).
      - name: Checkpoint fuzz
        env:
          STANZASHARP_FUZZ_ITERATIONS: 3000
          STANZASHARP_FUZZ_SEED: ${{ github.run_number }}
          STANZASHARP_FUZZ_MODELS: all
          STANZASHARP_FUZZ_REPORT: ${{ github.workspace }}/fuzz/checkpoints.txt
        run: |
          mkdir -p fuzz
          dotnet test tests/StanzaSharp.Tests -c Release --no-build --blame-hang-timeout 60m --blame-hang-dump-type none --logger trx --results-directory TestResults --filter "FullyQualifiedName~CheckpointFuzzTests"
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then echo "::error::Fuzz tests were skipped: the models were not found."; exit 1; fi
          if ! grep -q '<UnitTestResult ' TestResults/*.trx; then echo "::error::No test ran."; exit 1; fi

      - uses: actions/setup-python@v7
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'

      - name: Install Python Stanza
        if: ${{ !cancelled() }}
        # The CPU-only torch wheel; the default Linux wheel pulls in gigabytes of CUDA.
        run: pip install -r tools/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # Generated texts through Stanza and StanzaSharp (docs/text-fuzzing.md): exit 1 on any difference, each shrunk to
      # a minimal text in the report, except a decision float64 Stanza makes as StanzaSharp does (a float32 near-tie,
      # marked in the report). A port bug's shrunk text then goes into make_golden.py's FUZZ_TEXTS.
      - name: Text fuzz
        if: ${{ !cancelled() }}
        run: |
          mkdir -p fuzz
          seed=${{ github.run_number }}
          status=0
          python tools/text_fuzz.py run --seed "$seed" --count 1000 --processors tokenize,mwt --report fuzz/tokenize.json || status=1
          python tools/text_fuzz.py run --seed "$seed" --count 60 --report fuzz/default.json || status=1
          python tools/text_fuzz.py run --seed "$seed" --count 60 --package default_fast --report fuzz/default_fast.json || status=1
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz
          path: |
            fuzz/
            TestResults/*.trx
          if-no-files-found: ignore

  benchmark:
    uses: ./.github/workflows/benchmark.yml
    with:
      quick: true
      no_avx512: true

  # One open issue collects the failures: a comment per failed night with the run and its failed jobs.
  report:
    needs: [transformer, fuzz, benchmark]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: "transformer: ${{ needs.transformer.result }}, fuzz: ${{ needs.fuzz.result }}, benchmark: ${{ needs.benchmark.result }}"
        run: |
          title="Nightly run failed"
          body=$(printf 'The nightly run of %s (%s) failed.\n\n%s\n\n%s\n' "${GITHUB_SHA::7}" "$(date -u +%F)" "$RESULTS" "$RUN")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$(printf '%s\n\nEach later failed night comments here. Close this once the nightly is green again.\n' "$body")"
          fi
