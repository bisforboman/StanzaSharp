name: Release

# Merging a pull request that adds a version heading to CHANGELOG.md (e.g. "## [0.4.2] - 2026-10-07") publishes that
# version: the newest version in CHANGELOG.md without a tag yet. Versions with a '-' are prereleases and use the
# 'prerelease' environment; others use 'release' (approval required). The tag and the GitHub release are created only
# after the packages are on nuget.org, so a tag always marks a published version.
# Publishing uses NuGet Trusted Publishing: no stored API key (see the release notes in CLAUDE.md).

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The newest version heading in CHANGELOG.md ("Unreleased" doesn't match); nothing to do if its tag exists.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$version" ]; then echo "::error::No version heading in CHANGELOG.md"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Everything CI checks, including the full suite against the real models and the package check.
  checks:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    environment: ${{ contains(needs.version.outputs.version, '-') && 'prerelease' || 'release' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write   # create the tag and the GitHub release
      id-token: write   # request the OIDC token that NuGet/login exchanges for a temporary API key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # StanzaSharp and the stanzasharp tool. (The StanzaSharp.Cpu.* platform packages ended with 0.4.)
      - name: Pack
        run: |
          for project in StanzaSharp StanzaSharp.Tool; do
            dotnet pack src/$project --configuration Release -p:Version=$VERSION --output artifacts
          done

      # Request the temporary key right before pushing: it is valid for one hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Creates the tag v$VERSION on this commit, now that the packages are published.
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" artifacts/*.nupkg --target "$GITHUB_SHA" --title "StanzaSharp $VERSION" --generate-notes $prerelease
