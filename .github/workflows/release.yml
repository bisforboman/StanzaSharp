name: Release

# Merging a pull request that adds a version heading to CHANGELOG.md (e.g. "## [0.4.2] - 2026-10-07"; made by
# `python tools/changelog.py release X.Y.Z` from the entries in changes/) publishes that
# version: the newest version in CHANGELOG.md without a tag yet. Versions with a '-' are prereleases and use the
# 'prerelease' environment; others use 'release' (approval required). The tag and the GitHub release are created only
# after the packages are on nuget.org, so a tag always marks a published version.
# Publishing uses NuGet Trusted Publishing: no stored API key (see the release notes in CLAUDE.md).

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The newest version heading in CHANGELOG.md ("Unreleased" doesn't match); nothing to do if its tag exists.
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$version" ]; then echo "::error::No version heading in CHANGELOG.md"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Everything CI checks, including the full suite against the real models and the package checks: main's own CI run of
  # this commit (ci.yml on push, started by the same push), which this waits for and requires to have succeeded, instead
  # of running the whole suite a second time on the same runners (owner's decision, 2026-10-13: a release took 40+ min).
  # A cancelled run (a newer push to main cancels main's older CI run) or a failed one fails the release: re-run that CI
  # run, then this release run's failed jobs. If main has no CI run of this commit (none found within 2 min), checks
  # runs ci.yml here instead, as before.
  ci:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      actions: read
    outputs:
      found: ${{ steps.wait.outputs.found }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            run=$(gh run list --workflow ci.yml --commit "$SHA" --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run=
            if [ -n "$run" ] || [ $attempt = 7 ]; then break; fi
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::notice::No ci.yml push run for $SHA; running ci.yml in this release instead."
            echo found=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo found=true >> "$GITHUB_OUTPUT"
          url="https://github.com/$GH_REPO/actions/runs/$run"
          echo "Waiting for CI run $url"
          deadline=$((SECONDS + 170 * 60))
          while :; do
            state=$(gh run view "$run" --json status,conclusion --jq '.status + " " + .conclusion') || state="unknown "
            echo "$(date -u +%H:%M:%S) $state"
            if [ "${state%% *}" = completed ]; then break; fi
            if [ $SECONDS -ge $deadline ]; then echo "::error::CI run $url did not finish in time; re-run this release run's failed jobs once it has."; exit 1; fi
            sleep 60
          done
          conclusion=${state#* }
          case $conclusion in
            success) echo "CI run $url succeeded." ;;
            cancelled) echo "::error::CI run $url of this commit was cancelled (a newer push to main cancels main's older CI run), so nothing is published. Re-run that CI run, then re-run this release run's failed jobs."; exit 1 ;;
            *) echo "::error::CI run $url of this commit ended '$conclusion', so nothing is published. Fix it, or re-run it if it was a fluke, then re-run this release run's failed jobs."; exit 1 ;;
          esac

  # The fallback when main has no CI run of this commit: all of ci.yml, as part of this run.
  checks:
    needs: [version, ci]
    if: needs.ci.outputs.found == 'false'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci, checks]
    # checks is skipped when ci found main's run, which then succeeded (ci would have failed otherwise).
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.ci.outputs.found == 'true')) }}
    runs-on: ubuntu-26.04
    environment: ${{ contains(needs.version.outputs.version, '-') && 'prerelease' || 'release' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write   # create the tag and the GitHub release
      id-token: write   # request the OIDC token that NuGet/login exchanges for a temporary API key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # StanzaSharp, StanzaSharp.Cuda (packed from src/StanzaSharp.Cuda), StanzaSharp.DataIngestion (VERSION-preview while
      # Microsoft.Extensions.DataIngestion is a preview; its csproj) and the stanzasharp tool. (The StanzaSharp.Cpu.*
      # platform packages ended with 0.4.)
      - name: Pack
        run: |
          for project in StanzaSharp StanzaSharp.Cuda StanzaSharp.DataIngestion StanzaSharp.Tool; do
            dotnet pack src/$project --configuration Release -p:Version=$VERSION --output artifacts
          done

      # Request the temporary key right before pushing: it is valid for one hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Creates the tag v$VERSION on this commit, now that the packages are published.
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" artifacts/*.nupkg --target "$GITHUB_SHA" --title "StanzaSharp $VERSION" --generate-notes $prerelease
