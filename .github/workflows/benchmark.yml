name: Benchmark

# StanzaSharp vs Python Stanza on every free GitHub-hosted runner: `stanzasharp benchmark` (built from the checked-out
# commit) with Python Stanza 1.15.0 next to it. Manual only (Actions > Benchmark > Run workflow, or
# `gh workflow run benchmark.yml [-f lang=de]`); never on pushes or pull requests, and never a required check.
# Free standard runners only (owner's rule): no larger or paid runners.
# Each job writes its Markdown block to the job summary and the artifact benchmark-<runner> (benchmark.md + .json);
# the last job puts them into one table (its summary and the artifact benchmarks, benchmarks.md).
# The runners are shared virtual machines (macOS: virtualized Apple Silicon), so compare numbers from one run only.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: The language (benchmark jobs only; avx512 and startup stay English)
        type: choice
        options: [en, de]
        default: en
      package:
        description: Stanza's package (gsd and hdt are German only; default_accurate and ewt to mimic English only)
        type: choice
        options: [default, default_fast, default_accurate, combined, gsd, hdt, ewt, gum, lines, partut, atis, childes, eslspok, craft, genia, mimic]
        default: default
      quick:
        description: Smoke run (300 words, one run, 10 calls)
        type: boolean
        default: false
      avx512_only:
        description: Only the Vector512-vs-Vector256 jobs (avx512), not the runner matrix
        type: boolean
        default: false
      startup_only:
        description: Only the startup jobs (fresh processes, JIT and ReadyToRun builds), not the runner matrix
        type: boolean
        default: false
      startup_base:
        description: "startup: also measure the library at this ref (e.g. origin/main), with this commit's harness"
        type: string
        default: ''
      startup_settings:
        description: "startup: instead of the default settings, NAME=out/jit|out/r2r[@VAR=VALUE,...] separated by ;"
        type: string
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    if: ${{ !inputs.avx512_only && !inputs.startup_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-2025, windows-11-arm, macos-26]
    runs-on: ${{ matrix.os }}
    # default_accurate: Python Stanza takes about 150 s a run on 4 cores (round 44), and the warm-up and timed runs are
    # up to 8 of them.
    timeout-minutes: ${{ inputs.package == 'default_accurate' && 150 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      # A fresh macOS runner indexes with Spotlight for its first minutes, and again after pip writes torch's files:
      # mds/mdworker then take about half of the 3 vCPUs, and one-sentence calls took 717-845 ms instead of 94
      # (docs/performance/round-12-concurrent-calls-thread-pool.md).
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      # The whole history, for git describe's version (Build the tool).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Stanza's .pt files, which both sides read: English's from the cache ci.yml's cross-os and linux-arm64 jobs write,
      # German's (all its packages, fastText vectors included) from the one golden-shard 1 writes on Linux (a Linux cache
      # isn't restored on Windows or macOS). Restore only, no new entry; on a miss the tool downloads the package's files.
      - uses: actions/cache/restore@v6
        id: models
        with:
          path: models/stanza/${{ inputs.lang }}
          key: ${{ inputs.lang == 'de' && format('models-de-treebanks-{0}', hashFiles('src/StanzaSharp/ModelDownloader.cs')) || format('models-pt-{0}-{1}', runner.os, hashFiles('src/StanzaSharp/ModelDownloader.cs')) }}

      # The block's StanzaSharp version is git describe's (1.0.0 on the release commit, 1.0.0-67-g97089bb 67 commits
      # after it) instead of Directory.Build.props' placeholder 0.1.0-dev.
      - name: Build the tool
        run: |
          version=$(git describe --tags --match 'v*')
          dotnet build src/StanzaSharp.Tool -c Release -p:Version="${version#v}" -p:IncludeSourceRevisionInInformationalVersion=false

      # default_accurate's transformer models and google/electra-large-discriminator are in no cache (1.9 GB): always
      # downloaded (files that already match are kept).
      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true' || inputs.package == 'default_accurate'
        run: >
          dotnet src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll download models/stanza/${{ inputs.lang }}
          --lang ${{ inputs.lang }} --package ${{ inputs.package }}

      # Python Stanza as golden installs it (the CPU-only torch wheel); German needs nothing more (its models, fastText
      # vectors included, are the .pt files above). If a runner has no wheel for it, the benchmark
      # still runs, with StanzaSharp's column only and the reason in the block.
      # windows-11-arm: setup-python gives the Arm64 CPython and download.pytorch.org has torch 2.14.1+cpu for
      # win_arm64, but numpy 2.2.6 has no win_arm64 wheel (numpy's first is 2.3.0), and building it from source fails
      # (the runner's C compiler is an x64 MinGW gcc). So that runner alone takes numpy 2.3.5; Stanza and torch keep
      # requirements.txt's pins. The step prints the versions Python Stanza runs with.
      - uses: actions/setup-python@v7
        id: python
        continue-on-error: true
        with:
          python-version: '3.12'

      - name: Install Python Stanza
        id: stanza
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          requirements=tools/requirements.txt
          if [ "${{ matrix.os }}" = windows-11-arm ]; then
            requirements="$RUNNER_TEMP/requirements.txt"
            sed 's/^numpy==.*/numpy==2.3.5/' tools/requirements.txt > "$requirements"
          fi
          python -m pip install -r "$requirements" --extra-index-url https://download.pytorch.org/whl/cpu
          # default_accurate: Stanza's transformer models need transformers, tokenizers, safetensors and peft.
          if [ "${{ inputs.package }}" = default_accurate ]; then
            python -m pip install -r tools/requirements-transformer.txt
          fi
          python -c "import platform, stanza, torch, numpy; print(platform.machine(), 'stanza', stanza.__version__, 'torch', torch.__version__, 'numpy', numpy.__version__)"

      - name: Benchmark
        run: |
          python=python
          if [ "${{ steps.stanza.outcome }}" != success ]; then
            python=python-stanza-not-installed
            echo "::warning::Python Stanza could not be installed on ${{ matrix.os }}; StanzaSharp only."
          fi
          dotnet src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll benchmark --lang ${{ inputs.lang }} --package ${{ inputs.package }} \
            --models models/stanza/${{ inputs.lang }} --python "$python" --json benchmark.json ${{ inputs.quick && '--quick' || '' }} > benchmark.md
          { echo "## ${{ matrix.os }}"; echo; cat benchmark.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.md
            benchmark.json

  # The Vector512 (AVX-512) kernels against Vector256 (AVX2) on one machine: ubuntu-26.04 is sometimes an Intel Xeon
  # Platinum 8573C or other AVX-512 CPUs, often an AMD EPYC 7763 (none), so six jobs try; windows-2025, which draws the
  # same machines, gets three (Git Bash's /proc/cpuinfo has the flags too). A job without AVX-512 says so and
  # stops (success). One with it runs the managed kernel and pipeline tests (Vector512 is then the detected path) and
  # `stanzasharp benchmark` without Python, alternating DOTNET_PreferredVectorBitWidth=256 (Vector256) and the default
  # (Vector512), at the default threads and at 1. Its blocks go to the summary and the artifact avx512-<os>-<attempt>.
  avx512:
    if: ${{ !inputs.startup_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        attempt: [1, 2, 3, 4, 5, 6]
        include:
          - { os: windows-2025, attempt: 1 }
          - { os: windows-2025, attempt: 2 }
          - { os: windows-2025, attempt: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      STANZASHARP_MODELS: ${{ github.workspace }}/models/stanza/en
    steps:
      - name: CPU
        id: cpu
        run: |
          cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          if grep -qw avx512f /proc/cpuinfo; then avx512=yes; else avx512=no; fi
          echo "avx512=$avx512" >> "$GITHUB_OUTPUT"
          echo "$cpu, AVX-512: $avx512" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $avx512 = no ]; then echo "::notice::No AVX-512 on this runner ($cpu): Vector512 not tested or measured here."; fi

      - uses: actions/checkout@v7
        if: steps.cpu.outputs.avx512 == 'yes'
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        if: steps.cpu.outputs.avx512 == 'yes'
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache/restore@v6
        if: steps.cpu.outputs.avx512 == 'yes'
        id: models
        with:
          path: models/stanza/en
          key: models-pt-${{ runner.os }}-${{ hashFiles('src/StanzaSharp/ModelDownloader.cs') }}

      - name: Build
        if: steps.cpu.outputs.avx512 == 'yes'
        run: |
          version=$(git describe --tags --match 'v*')
          dotnet build StanzaSharp.slnx -c Release
          dotnet build src/StanzaSharp.Tool -c Release -p:Version="${version#v}" -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Download the models
        if: steps.cpu.outputs.avx512 == 'yes' && steps.models.outputs.cache-hit != 'true'
        run: |
          dotnet src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll download models/stanza/en
          dotnet src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll download models/stanza/en --package default_fast

      - name: Benchmark Vector512 against Vector256
        if: steps.cpu.outputs.avx512 == 'yes'
        run: |
          tool=src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll
          mkdir -p avx512
          for threads in 0 1; do
            for round in 1 2; do
              for width in 256 512; do
                name="avx512/threads-$threads.round-$round.vector$width"
                args=(benchmark --package ${{ inputs.package }} --models models/stanza/en --python python-not-used --json "$name.json")
                if [ $threads != 0 ]; then args+=(--threads $threads); fi
                if [ $width = 256 ]; then export DOTNET_PreferredVectorBitWidth=256; else unset DOTNET_PreferredVectorBitWidth; fi
                dotnet $tool "${args[@]}" ${{ inputs.quick && '--quick' || '' }} > "$name.md"
                grep -q "SIMD Vector$width" "$name.md" || { echo "::error::$name did not run on Vector$width"; cat "$name.md"; exit 1; }
                { echo "### $name"; echo; cat "$name.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
              done
            done
          done

      # The kernels alone (`managed-spike gemm`: the charlm's, the tagger's and the highway's GEMM shapes), per path, at 1
      # thread and at all.
      - name: GEMM rates
        if: steps.cpu.outputs.avx512 == 'yes'
        run: |
          for threads in 1 4; do
            for path in vector256 vector512; do
              echo "### gemm, $path, $threads threads"; echo; echo '```'
              dotnet samples/StanzaSharp.Benchmark/bin/Release/net10.0/StanzaSharp.Benchmark.dll managed-spike gemm --threads $threads --path $path
              echo '```'; echo
            done
          done | tee -a "$GITHUB_STEP_SUMMARY" avx512/gemm.md

      - name: Test (Vector512 detected)
        if: steps.cpu.outputs.avx512 == 'yes'
        run: >
          dotnet test tests/StanzaSharp.Tests -c Release --no-build --blame-hang-timeout 30m --blame-hang-dump-type none
          --logger trx --logger "console;verbosity=detailed" --results-directory TestResults
          --filter "FullyQualifiedName~ManagedBackendTests|FullyQualifiedName~PipelineTests"

      - name: Check that no test was skipped
        if: steps.cpu.outputs.avx512 == 'yes'
        run: |
          if grep -h 'outcome="NotExecuted"' TestResults/*.trx | grep -v 'Run_PythonStanza_' | grep -qvE 'lang: (&quot;|")de|German'; then
            echo "::error::Tests were skipped; the models in models/stanza/en were not found."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.cpu.outputs.avx512 == 'yes'
        with:
          name: avx512-${{ matrix.os }}-${{ matrix.attempt }}
          path: |
            avx512/
            TestResults/*.trx

  # Startup cost (docs/performance/round-17-startup.md): Pipeline.Load and the first Process calls, each process fresh, under
  # several settings that alternate within each round (tools/startup.py, `StanzaSharp.Benchmark startup`): the plain
  # build (JIT), a ReadyToRun publish of the same app (what PublishReadyToRun in a user's app gives our assemblies too),
  # and DOTNET_* knobs. With startup_base, also the library at that ref under this commit's harness. Stanza's .pt
  # files, the default package, default threads. Tables in the summary and the artifact startup-<runner>.
  startup:
    if: ${{ inputs.startup_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, rid: linux-x64 }
          - { os: ubuntu-26.04-arm, rid: linux-arm64 }
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-26, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache/restore@v6
        id: models
        with:
          path: models/stanza/en
          key: models-pt-${{ runner.os }}-${{ hashFiles('src/StanzaSharp/ModelDownloader.cs') }}

      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          dotnet build src/StanzaSharp.Tool -c Release
          dotnet src/StanzaSharp.Tool/bin/Release/net10.0/StanzaSharp.Tool.dll download models/stanza/en

      # No native libtorch (StanzaSharpNoLibTorch): the startup mode runs the managed backend only.
      - name: Build
        run: |
          publish() { dotnet publish "$1/samples/StanzaSharp.Benchmark" -c Release -p:StanzaSharpNoLibTorch=true -o "$2" "${@:3}"; }
          publish . out/jit
          publish . out/r2r -r ${{ matrix.rid }} --self-contained false -p:PublishReadyToRun=true
          if [ -n "${{ inputs.startup_base }}" ]; then
            git worktree add base "${{ inputs.startup_base }}"
            git -C base checkout "$GITHUB_SHA" -- samples/StanzaSharp.Benchmark
            publish base out/base
          fi

      - name: Measure
        env:
          SETTINGS: ${{ inputs.startup_settings }}
        run: |
          settings=(jit=out/jit r2r=out/r2r "jit, no TieredPGO=out/jit@DOTNET_TieredPGO=0"
            "r2r, no TieredPGO=out/r2r@DOTNET_TieredPGO=0" "jit, no tiering=out/jit@DOTNET_TieredCompilation=0"
            "r2r, no tiering=out/r2r@DOTNET_TieredCompilation=0" "jit, no QuickJitForLoops=out/jit@DOTNET_TC_QuickJitForLoops=0")
          if [ -n "$SETTINGS" ]; then IFS=';' read -ra settings <<< "$SETTINGS"; fi
          if [ -n "${{ inputs.startup_base }}" ]; then settings=("base=out/base" "${settings[@]}"); fi
          {
            echo "## ${{ matrix.os }}"; echo
            echo "### One sentence (13 words) per call"; echo
            python tools/startup.py --models models/stanza/en --rounds 5 --text one --calls 6 "${settings[@]}"
            echo; echo "### The benchmark text (2,009 words) per call"; echo
            python tools/startup.py --models models/stanza/en --rounds 3 --text bench --calls 4 "${settings[@]}"
          } > startup.md
          cat startup.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-${{ matrix.os }}
          path: startup.md

  # One table over every runner that finished, then each runner's block.
  summary:
    needs: benchmark
    if: ${{ !cancelled() && !inputs.avx512_only && !inputs.startup_only }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/benchmark_table.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: results

      - name: Combine
        run: |
          python3 tools/benchmark_table.py results > benchmarks.md
          cat benchmarks.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmarks.md
