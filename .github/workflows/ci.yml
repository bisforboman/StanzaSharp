name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # release.yml waits for main's run of the commit; only without one does it call this (no inputs: everything runs).
  # nightly.yml calls it with golden_shards '[4]': only golden shard 4 (the Transformer* classes) and the golden check.
  workflow_call:
    inputs:
      golden_shards:
        description: The golden shards to run, a JSON array; set, every other job is skipped
        type: string
        default: ''

# A newer push to the same pull request or to main cancels the run still going (GitHub-hosted runners allow 20
# concurrent jobs, 5 on macOS, and back-to-back merges each start the full suite). A release whose main run was cancelled
# this way fails and says to re-run that run (release.yml). release.yml's fallback call has its own
# group (github.workflow is the caller's name there), so it and main's own run never cancel each other, and a release
# check is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The test classes of shards 2, 3 and 4 (golden-shard; cross-os-shard has no shard 4); shard 1 runs the complement.
  # See golden-shard.
  SHARD_TWO: >-
    .ConcurrencyTests.ConcurrentCalls_ .FastPackageTests. .GcPressureTests. .ManagedBackendTests. .TokenizerTests.
    .CompareCommandTests. .BenchmarkCommandTests.
  SHARD_THREE: .PipelineTests. .NerTests. .SentimentTests. .InputModeTests. .DepparseTests. .NoSsplitTests.
  # The Transformer* classes (TransformerModelTests, ...): only golden-shard 4 downloads the transformer they read.
  SHARD_FOUR: .Transformer

jobs:
  # Everything builds and tests in Release: the managed backend's kernels are many times slower in Debug, which once
  # made the cross-os test steps run for hours. --blame-hang-timeout names a test that hangs; timeout-minutes caps a job.
  # How much each run checks (owner's decision, 2026-10-09: save runners):
  # - code=false (steps skipped): a draft pull request, or one that changes nothing but documentation. Drafts can't be
  #   merged; marking one ready for review (ready_for_review) starts its real run.
  # - level=light: a ready pull request. docker and alpine run everything, golden too apart from torch=smoke (below);
  #   cross-os and linux-arm64 run
  #   a subset (pipeline golden files on both backends, the managed kernels, the no-libtorch check) and no package checks.
  # - level=full: pushes to main and release.yml's runs: everything everywhere. (No merge queue: GitHub offers it only
  #   to organization-owned repositories.)
  # - torch=smoke (owner's decision, 2026-10-10): a ready pull request that touches none of the TorchSharp backend's
  #   files (below). golden then runs every managed test but, of the TorchSharp-backend cases ("managed: False" and
  #   [Trait("Backend", "TorchSharp")]), only those marked [Trait("Smoke", "TorchSharp")]. Otherwise torch=full.
  # Required jobs still run with their steps skipped rather than being skipped (a skipped job would count as passed).
  # Anything but a clear false, including this job failing, runs everything; anything but a clear light/smoke runs full.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.files.outputs.code }}
      level: ${{ steps.files.outputs.level }}
      torch: ${{ steps.files.outputs.torch }}
      shards: ${{ steps.files.outputs.shards }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.golden_shards }}" ]; then echo "shards=${{ inputs.golden_shards }}" >> "$GITHUB_OUTPUT"; else echo 'shards=[1, 2, 3, 4]' >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; echo level=full >> "$GITHUB_OUTPUT"; echo torch=full >> "$GITHUB_OUTPUT"; exit 0; fi
          echo level=light >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.pull_request.draft }}" = true ]; then echo "Draft: nothing to check until it is ready."; echo code=false >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > files.txt
          cat files.txt
          # Documentation: docs/, any Markdown file (README, CHANGELOG, CLAUDE.md, PACKAGE.md), LICENSE, NOTICE.
          if [ ! -s files.txt ] || grep -qvE '^docs/|\.md$|^LICENSE$|^NOTICE$' files.txt; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"
          # The TorchSharp backend (StanzaSharp.Cuda), the seam both backends share (Nn: Backend, CharlmCache, Pretrain;
          # BackendModels, PipelineBackend), the TorchSharp/libtorch versions (Directory.Build.props) and CI itself.
          if [ -s files.txt ] && ! grep -qE '^src/StanzaSharp\.Cuda/|^src/StanzaSharp\.Nn/|^src/StanzaSharp/(BackendModels|PipelineBackend)\.cs$|^Directory\.Build\.props$|^\.github/workflows/' files.txt; then echo torch=smoke; else echo torch=full; fi >> "$GITHUB_OUTPUT"
          # Golden shard 4 (the Transformer* classes, about 30 min with the transformer's download) runs on a pull request
          # only when it touches what they read: the torch=full files above, the downloader and CI's model lists, the
          # transformer golden data and the Transformer* tests. A processor-only change skips it; the nightly run
          # (nightly.yml) and every push to main still run it (owner's decision, 2026-10-18). The last write wins.
          if [ -s files.txt ] && ! grep -qE '^src/StanzaSharp\.Cuda/|^src/StanzaSharp\.Nn/|^src/StanzaSharp/(BackendModels|PipelineBackend|ModelDownloader)\.cs$|^Directory\.Build\.props$|^\.github/workflows/|^tools/ci-models\.sh$|^tests/golden/(.*/)?transformer/|^tests/StanzaSharp\.Tests/Transformer[^/]*\.cs$' files.txt; then echo 'shards=[1, 2, 3]' >> "$GITHUB_OUTPUT"; fi

  # Build and the tests that need no model files (the model tests skip).
  build-test:
    if: inputs.golden_shards == ''
    timeout-minutes: 90
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      # Warnings as errors here only: StyleBro's and the .editorconfig's rules (EnforceCodeStyleInBuild) fail the PR, while
      # the other jobs keep building on every OS without failing on a platform-only warning.
      - name: Build
        run: dotnet build StanzaSharp.slnx -c Release -p:TreatWarningsAsErrors=true

      # Whitespace and every fix StyleBro's rules have; the version matches StyleBro.Analyzers in Directory.Build.props.
      - name: Code style
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/stylebro" StyleBro.Migrate --version 0.7.0-alpha.1
          "$RUNNER_TEMP/stylebro/stylebro-migrate" format StanzaSharp.slnx --verify-no-changes --severity warn --no-restore

      - name: Test
        run: dotnet test StanzaSharp.slnx -c Release --no-build --blame-hang-timeout 30m --blame-hang-dump-type none --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-build-test
          path: TestResults/*.trx

  # The full suite against Stanza's real English models, downloaded and converted with the pinned stanza version.
  # Split into three jobs by test class (owner's decision, 2026-10-10), balanced by the golden trx's class times (full
  # run, minutes summed over tests): 1 = ConcurrencyTests' cancellation cases (10.6, one at a time) and every class not
  # named below (~15 in all); 2 = ConcurrencyTests' concurrent calls (11.5, one at a time) + FastPackage, GcPressure,
  # ManagedBackend, Tokenizer, and CompareCommand + BenchmarkCommand with Python Stanza (~20; the shard that finished
  # first); 3 = Pipeline, Ner, Sentiment, InputMode, Depparse, NoSsplit (~45, in parallel).
  # 4 = the Transformer* classes (default_accurate's encoder on both backends; in shard 1 they made its job 82 min).
  # Shard 1's filter is the complement of the others, so together they run every test exactly once, new
  # classes too.
  # With torch=smoke, each shard leaves out the TorchSharp-backend cases not marked [Trait("Smoke", "TorchSharp")].
  golden-shard:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Every shard unless changes says otherwise (an empty output, changes failing, runs all four).
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1, 2, 3, 4]') }}
    timeout-minutes: 90
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      # Each model cache's key hashes exactly the files and MD5s it holds (tools/ci-models.sh, from the Cli's
      # `download --list`), so a new or changed MD5 rotates only the caches holding that file (owner's decision, 2026-10-16).
      - name: Model cache keys
        if: needs.changes.outputs.code != 'false'
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release
          tools/ci-models.sh keys

      # The model list (tools/ci-models.sh en) pins the models; the converter decides their converted form.
      # Both are kept: the .pt loader tests compare models/stanza/en with models/converted/en.
      # Shard 1 writes the cache (right after converting, before the English treebank models join models/stanza/en); the
      # others, docker and alpine only restore it. On a miss each shard makes its own.
      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        id: models-save
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard != 1
        id: models-restore
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      # German (owner's decision, 2026-10-13): Stanza's .pt files only, no conversion (the tests read .pt as they are),
      # about 1.3 GB for default, default_fast, gsd and hdt (combined reads default's), and ner conll03 (51 MB, ModelChoiceTests). Only these Linux shards run the
      # German tests; cross-os and linux-arm64 stay English, where the German rows skip and their no-skip checks exempt them.
      # Shard 1 saves it right after the German download, before the German treebank choices (models-treebank-choices) arrive.
      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        id: models-de-save
        with:
          path: models/stanza/de
          key: models-de-treebanks-${{ steps.keys.outputs.de }}

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard != 1
        id: models-de-restore
        with:
          path: models/stanza/de
          key: models-de-treebanks-${{ steps.keys.outputs.de }}

      # Which CPU this runner got (informational, never fails). ubuntu-26.04 and windows-2025 are sometimes an AVX-512
      # Xeon: the managed tests then also run the Vector512 kernels, the detected path there. Vector512 gives Vector256's
      # bits (ManagedBackendTests.Vector512_GivesVector256sBits), so the draw can't change a result.
      - name: CPU
        if: needs.changes.outputs.code != 'false'
        run: |
          if [ -r /proc/cpuinfo ]; then
            cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)
            if grep -qw avx512f /proc/cpuinfo; then echo "$cpu: AVX-512, Vector512 kernels tested"; else echo "::notice::$cpu: no AVX-512 on this runner, Vector512 kernels not tested"; fi
          else
            sysctl -n machdep.cpu.brand_string
          fi

      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: dotnet build StanzaSharp.slnx -c Release

      # The library's own downloader, as users run it; Python is only needed for the converter.
      - name: Download the models
        if: needs.changes.outputs.code != 'false' && (steps.models-save.outputs.cache-hit || steps.models-restore.outputs.cache-hit) != 'true'
        run: tools/ci-models.sh download en

      - name: Download the German models
        if: needs.changes.outputs.code != 'false' && (steps.models-de-save.outputs.cache-hit || steps.models-de-restore.outputs.cache-hit) != 'true'
        run: tools/ci-models.sh download de

      - uses: actions/cache/save@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1 && steps.models-de-save.outputs.cache-hit != 'true'
        with:
          path: models/stanza/de
          key: models-de-treebanks-${{ steps.keys.outputs.de }}

      # Python Stanza: the converter on a model-cache miss, and in shard 2 the Run_PythonStanza_* tests (stanzasharp
      # compare and benchmark against Python Stanza; about 40 s to install, 1 min to run).
      - uses: actions/setup-python@v7
        id: python
        if: needs.changes.outputs.code != 'false' && (matrix.shard == 2 || (steps.models-save.outputs.cache-hit || steps.models-restore.outputs.cache-hit) != 'true')
        with:
          python-version: '3.12'

      - name: Install Python Stanza
        if: needs.changes.outputs.code != 'false' && (matrix.shard == 2 || (steps.models-save.outputs.cache-hit || steps.models-restore.outputs.cache-hit) != 'true')
        # The CPU-only torch wheel; the default Linux wheel pulls in gigabytes of CUDA.
        run: pip install -r tools/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Convert the models
        if: needs.changes.outputs.code != 'false' && (steps.models-save.outputs.cache-hit || steps.models-restore.outputs.cache-hit) != 'true'
        run: python tools/stanza_convert.py convert models/stanza/en --out models/converted/en

      - uses: actions/cache/save@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1 && steps.models-save.outputs.cache-hit != 'true'
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      # English treebank packages (owner's decision, 2026-10-15) and Pipeline.Alternatives' English models
      # (PipelineOptions.Models, 2026-10-16): exactly the files of tools/ci-models.sh's en-treebanks group that models-en
      # lacks (the biomedical packages' own vectors and charlms included), listed by the keys step, about 2.8 GB,
      # restored into models/stanza/en, where the tests read them. Only these Linux shards run them; elsewhere
      # TreebankPackageTests' and ModelChoiceTests' rows skip, and the no-skip checks exempt those classes.
      - uses: actions/cache@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        id: models-en-treebanks-save
        with:
          path: ${{ steps.keys.outputs.en_treebanks_paths }}
          key: models-en-treebanks-${{ steps.keys.outputs.en_treebanks }}

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard != 1
        id: models-en-treebanks-restore
        with:
          path: ${{ steps.keys.outputs.en_treebanks_paths }}
          key: models-en-treebanks-${{ steps.keys.outputs.en_treebanks }}

      - name: Download the English treebank models
        if: needs.changes.outputs.code != 'false' && (steps.models-en-treebanks-save.outputs.cache-hit || steps.models-en-treebanks-restore.outputs.cache-hit) != 'true'
        run: tools/ci-models.sh download en-treebanks

      # The treebanks' _nocharlm taggers and parsers and _charlm tokenizers and lemmatizers (owner's decisions, 2026-10-16;
      # Pipeline.Alternatives, ModelChoiceTests, CharlmInputTests), English and German, about 1.3 GB: their own cache
      # (tools/ci-models.sh en-treebank-choices + de-treebank-choices), so they rotate
      # no other key. Restored next to the other models; elsewhere their rows skip like the other ModelChoiceTests rows.
      - uses: actions/cache@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        id: models-treebank-choices-save
        with:
          path: ${{ steps.keys.outputs.treebank_choices_paths }}
          key: models-treebank-choices-${{ steps.keys.outputs.treebank_choices }}

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false' && matrix.shard != 1
        id: models-treebank-choices-restore
        with:
          path: ${{ steps.keys.outputs.treebank_choices_paths }}
          key: models-treebank-choices-${{ steps.keys.outputs.treebank_choices }}

      - name: Download the treebank choices
        if: needs.changes.outputs.code != 'false' && (steps.models-treebank-choices-save.outputs.cache-hit || steps.models-treebank-choices-restore.outputs.cache-hit) != 'true'
        run: |
          tools/ci-models.sh download en-treebank-choices
          tools/ci-models.sh download de-treebank-choices

      # The transformers that default_accurate's models read (docs/transformer-plan.md), from Hugging Face at their pinned
      # revision: downloaded on every run, never cached (owner's decision, 2026-10-17: the model caches are near GitHub's
      # 10 GB). Only shard 4 runs the Transformer* test classes (SHARD_FOUR); the other jobs' no-skip checks exempt
      # them.
      - name: Download the transformer files
        if: needs.changes.outputs.code != 'false' && matrix.shard == 4
        run: tools/ci-models.sh transformer

      # The language identifier (9 MB, LanguageIdentifierTests in shard 1): downloaded on every run, like the transformers;
      # the other jobs' no-skip checks exempt its tests.
      - name: Download the language identifier
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        run: tools/ci-models.sh langid

      - name: Test
        if: needs.changes.outputs.code != 'false'
        env:
          STANZASHARP_PYTHON: ${{ matrix.shard == 2 && steps.python.outputs.python-path || '' }}
        run: |
          any() { printf 'FullyQualifiedName~%s|' $1 | sed 's/|$//'; }
          none() { printf 'FullyQualifiedName!~%s&' $1 | sed 's/&$//'; }
          case ${{ matrix.shard }} in
            1) filter=$(none "$SHARD_TWO $SHARD_THREE $SHARD_FOUR");; 2) filter=$(any "$SHARD_TWO");; 3) filter=$(any "$SHARD_THREE");;
            4) filter=$(any "$SHARD_FOUR");;
          esac
          if [ "${{ needs.changes.outputs.torch }}" = smoke ]; then
            filter="($filter)&((DisplayName!~managed: False&Backend!=TorchSharp)|Smoke=TorchSharp)"
          fi
          echo "$filter"
          # libtorch picks its float32 kernels by CPU (MKL's sgemm per ISA, ATen's avx2/avx512 kernels), so on an Intel
          # AVX-512 runner the TorchSharp backend drifted 1.2e-4 from Stanza where AMD drifts 6.1e-5 (German default_fast
          # UPOS logits near |285|; docs/performance/round-26-torchsharp-intel-drift.md). These two pick the same kernels on
          # every x64 CPU: results are bit-identical on all runners drawn. Test environment only; users keep the defaults.
          if [ "$RUNNER_ARCH" = X64 ]; then export ATEN_CPU_CAPABILITY=default MKL_CBWR=COMPATIBLE,STRICT; fi
          dotnet test StanzaSharp.slnx -c Release --no-build --blame-hang-timeout 30m --blame-hang-dump-type none --logger trx --results-directory TestResults --filter "$filter"

      # A skipped test here means the models (English or German; or, for Run_PythonStanza_*, Python Stanza) were not
      # found; no test at all, a broken filter.
      - name: Check that no test was skipped
        if: needs.changes.outputs.code != 'false'
        run: |
          ls TestResults/*.trx
          # Skipped tests are outcome="NotExecuted" (the Counters' notExecuted stays 0 for them).
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Tests were skipped; the models in models/stanza/en or models/converted/en, or Python Stanza, were not found."
            exit 1
          fi
          if ! grep -q '<UnitTestResult ' TestResults/*.trx; then echo "::error::No test ran."; exit 1; fi

      # The package checks take about a minute together, so they run in one shard, the shortest.
      # Pack, then build and run a fresh app that references the package as a user of the TorchSharp backend would
      # (StanzaSharp + TorchSharp-cpu, with StanzaSharpTrimNative). Part of the TorchSharp smoke check, so always run.
      - name: Verify the package
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en

      # The default install: only StanzaSharp, no libtorch at all; the default (managed) backend must run without it.
      - name: Verify the package without libtorch (managed backend)
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en -Managed

      # The stanzasharp tool (StanzaSharp.Tool): installed from a local feed, no native files, downloads tokenize,mwt.
      - name: Verify the tool package
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1
        shell: pwsh
        run: ./tools/verify-tool.ps1

      # Native AOT (x86-64-v3) and trimmed publishes of ManagedCheck (docs/aot.md): no IL2xxx/IL3xxx warning, no torch
      # file, both English packages byte-identical. Full runs, and light runs that touch the shared seam or CI (torch=full).
      - name: Verify Native AOT and trimming
        if: needs.changes.outputs.code != 'false' && matrix.shard == 1 && (needs.changes.outputs.level != 'light' || needs.changes.outputs.torch == 'full')
        run: |
          command -v clang > /dev/null && dpkg -s zlib1g-dev > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y clang zlib1g-dev; }
          bash tools/verify-aot.sh models/stanza/en linux-x64

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code != 'false'
        with:
          name: test-results-golden-${{ matrix.shard }}
          path: TestResults/*.trx

  # The check branch protection requires: passes only if every golden shard passed (a skipped, failed or cancelled
  # shard fails it). Its own name stays golden, so the protection rule needs no change.
  golden:
    needs: golden-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "golden-shard: ${{ needs.golden-shard.result }}"
          test "${{ needs.golden-shard.result }}" = success

  # The Docker sample (samples/docker) built from this commit's StanzaSharp package, published for linux-x64 into the
  # plain and the chiseled .NET runtime images, on the default managed backend: no libtorch may be in the image. In
  # each, the container must turn corpus.txt into tests/golden/pipeline.conllu byte for byte (all eight processors,
  # models mounted read-only).
  # The models come from golden's cache, written by golden-shard 1 (restore only, no new cache entry); on a miss they are downloaded.
  # No Docker layer cache: it would cost about 700 MB of the 10 GB cache budget to save a minute.
  docker:
    needs: changes
    if: ${{ !cancelled() && inputs.golden_shards == '' }}
    timeout-minutes: 90
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x

      # Each model cache's key hashes exactly the files and MD5s it holds (tools/ci-models.sh, from the Cli's
      # `download --list`), so a new or changed MD5 rotates only the caches holding that file (owner's decision, 2026-10-16).
      - name: Model cache keys
        if: needs.changes.outputs.code != 'false'
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release -p:StanzaSharpNoLibTorch=true
          tools/ci-models.sh keys

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false'
        id: models
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      - name: Download the models
        if: needs.changes.outputs.code != 'false' && (steps.models.outputs.cache-hit != 'true')
        run: dotnet run --project samples/StanzaSharp.Cli -c Release --no-build -- download models/stanza/en

      - name: Build and check the images
        if: needs.changes.outputs.code != 'false'
        run: >
          tools/verify-docker.sh models/stanza/en
          mcr.microsoft.com/dotnet/runtime:10.0
          mcr.microsoft.com/dotnet/runtime:10.0-noble-chiseled

  # Alpine (musl): the same Docker check on mcr.microsoft.com/dotnet/runtime:10.0-alpine, published for linux-musl-x64.
  # libtorch has no musl build, so only the managed backend runs there. A required check on main.
  alpine:
    needs: changes
    if: ${{ !cancelled() && inputs.golden_shards == '' }}
    timeout-minutes: 90
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x

      # Each model cache's key hashes exactly the files and MD5s it holds (tools/ci-models.sh, from the Cli's
      # `download --list`), so a new or changed MD5 rotates only the caches holding that file (owner's decision, 2026-10-16).
      - name: Model cache keys
        if: needs.changes.outputs.code != 'false'
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release -p:StanzaSharpNoLibTorch=true
          tools/ci-models.sh keys

      - uses: actions/cache/restore@v6
        if: needs.changes.outputs.code != 'false'
        id: models
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ steps.keys.outputs.en }}-${{ hashFiles('tools/requirements.txt', 'tools/stanza_convert.py') }}

      - name: Download the models
        if: needs.changes.outputs.code != 'false' && (steps.models.outputs.cache-hit != 'true')
        run: dotnet run --project samples/StanzaSharp.Cli -c Release --no-build -- download models/stanza/en

      - name: Build and check the image
        if: needs.changes.outputs.code != 'false'
        run: tools/verify-docker.sh models/stanza/en mcr.microsoft.com/dotnet/runtime:10.0-alpine

  # Linux on Arm64 (GitHub's ubuntu-26.04-arm runner): neither libtorch nor TorchSharp has a linux-arm64 build, so only
  # the managed backend runs. The tests build without libtorch (StanzaSharpNoLibTorch) and run every test that needs
  # none: the managed cases of the both-backend theories (DisplayName "managed: True") and the tests marked
  # [Trait("Backend", "Managed")]. Then the same no-skip check and the default install (verify-package.ps1 -Managed).
  # Models are cached like cross-os's. A required check on main.
  linux-arm64:
    needs: changes
    if: ${{ !cancelled() && inputs.golden_shards == '' }}
    timeout-minutes: 90
    runs-on: ubuntu-26.04-arm
    env:
      STANZASHARP_MODELS: ${{ github.workspace }}/models/stanza/en
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x

      # Each model cache's key hashes exactly the files and MD5s it holds (tools/ci-models.sh, from the Cli's
      # `download --list`), so a new or changed MD5 rotates only the caches holding that file (owner's decision, 2026-10-16).
      - name: Model cache keys
        if: needs.changes.outputs.code != 'false'
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release -p:StanzaSharpNoLibTorch=true
          tools/ci-models.sh keys

      - uses: actions/cache@v6
        if: needs.changes.outputs.code != 'false'
        id: models
        with:
          path: models/stanza/en
          key: models-pt-${{ runner.os }}-${{ steps.keys.outputs.en }}

      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: dotnet build StanzaSharp.slnx -c Release -p:StanzaSharpNoLibTorch=true

      - name: Download the models
        if: needs.changes.outputs.code != 'false' && (steps.models.outputs.cache-hit != 'true')
        run: tools/ci-models.sh download en

      - name: Test (managed backend)
        if: needs.changes.outputs.code != 'false'
        run: >
          dotnet test tests/StanzaSharp.Tests -c Release --no-build --blame-hang-timeout 30m --blame-hang-dump-type none
          --logger trx --results-directory TestResults
          --filter "${{ needs.changes.outputs.level == 'light' && '(DisplayName~managed: True|Backend=Managed)&(FullyQualifiedName~PipelineTests|FullyQualifiedName~ManagedBackendTests|FullyQualifiedName~ManagedCheckTests)' || 'DisplayName~managed: True|Backend=Managed' }}"

      - name: Check that no test was skipped
        if: needs.changes.outputs.code != 'false'
        run: |
          ls TestResults/*.trx
          # Run_PythonStanza_* needs Python Stanza, which this job doesn't install (golden-shard 2 runs them). German tests
          # (rows with lang "de", names with German) need the German models, and TreebankPackageTests', ModelChoiceTests' and OptionTests' English rows and CharlmInputTests the
          # English treebank and alternative models, which only golden-shard has, and the Transformer* classes the transformer files
          # golden-shard 4 downloads, and LanguageIdentifierTests and MultilingualPipelineTests the language identifier golden-shard 1 downloads.
          if grep -h 'outcome="NotExecuted"' TestResults/*.trx | grep -v 'Run_PythonStanza_' | grep -qvE 'lang: (&quot;|")de|German|TreebankPackageTests|ModelChoiceTests|OptionTests|CharlmInputTests|Transformer|LanguageIdentifierTests|MultilingualPipelineTests'; then
            echo "::error::Tests were skipped; the models in models/stanza/en were not found."
            exit 1
          fi

      - name: Verify the package without libtorch (managed backend)
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.level != 'light'
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en -Managed

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code != 'false'
        with:
          name: test-results-linux-arm64
          path: TestResults/*.trx

  # Windows (x64 and Arm64) and macOS (Apple Silicon): the full suite and the package check against Stanza's .pt files.
  # On Windows Arm64, Directory.Build.props adds libtorch-cpu-win-arm64 to the tests (TorchSharp-cpu lacks it).
  # golden stays the reference run; only it converts the models (Python) and compares .pt with converted.
  # No NuGet cache here: TorchSharp-cpu pulls all three libtorch builds, and the repository's 10 GB cache
  # budget goes to the models.
  # Split like golden-shard, with the same filters (owner's decision, 2026-10-13). As one job per OS the full suite took
  # 29 (windows-2025), 40 (macos-26) and 61 min (windows-11-arm) of tests, mostly ConcurrencyTests' two halves, which xunit
  # runs one test at a time after everything else (7.6 + 7.6, 11.8 + 11.4 and 25.4 + 17.6 min); shards 1 and 2 now run
  # them side by side. A light run (a ready PR) stays one job per OS, shard 1 with the light filter: its subset is mostly
  # PipelineTests, one class, which doesn't split. Three macOS shards plus benchmark.yml's two stay within the 5
  # concurrent macOS jobs of free runners.
  cross-os-shard:
    needs: changes
    if: ${{ !cancelled() && inputs.golden_shards == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, windows-11-arm]
        shard: ${{ fromJSON(needs.changes.outputs.level == 'light' && '[1]' || '[1, 2, 3]') }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Pipeline.Load and every test accept the .pt download directly.
      STANZASHARP_MODELS: ${{ github.workspace }}/models/stanza/en
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x

      # Each model cache's key hashes exactly the files and MD5s it holds (tools/ci-models.sh, from the Cli's
      # `download --list`), so a new or changed MD5 rotates only the caches holding that file (owner's decision, 2026-10-16).
      - name: Model cache keys
        if: needs.changes.outputs.code != 'false'
        id: keys
        run: |
          dotnet build samples/StanzaSharp.Cli -c Release
          tools/ci-models.sh keys

      # Every shard may save it: on a miss the first to finish saves, the others' saves are no-ops.
      - uses: actions/cache@v6
        if: needs.changes.outputs.code != 'false'
        id: models
        with:
          path: models/stanza/en
          key: models-pt-${{ runner.os }}-${{ steps.keys.outputs.en }}

      # For the TorchSharp backend's tests: libtorch-cpu-osx-arm64's libtorch_cpu.dylib links OpenMP by Homebrew's
      # absolute path (/opt/homebrew/opt/libomp/lib/libomp.dylib), not the libomp.dylib it ships. TorchSharp-backend
      # users on macOS need it too; the default managed backend doesn't.
      - name: Install libomp (macOS)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'macOS')
        run: brew install libomp

      # Which CPU this runner got (informational, never fails). ubuntu-26.04 and windows-2025 are sometimes an AVX-512
      # Xeon: the managed tests then also run the Vector512 kernels, the detected path there. Vector512 gives Vector256's
      # bits (ManagedBackendTests.Vector512_GivesVector256sBits), so the draw can't change a result.
      - name: CPU
        if: needs.changes.outputs.code != 'false'
        run: |
          if [ -r /proc/cpuinfo ]; then
            cpu=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)
            if grep -qw avx512f /proc/cpuinfo; then echo "$cpu: AVX-512, Vector512 kernels tested"; else echo "::notice::$cpu: no AVX-512 on this runner, Vector512 kernels not tested"; fi
          else
            sysctl -n machdep.cpu.brand_string
          fi

      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: dotnet build StanzaSharp.slnx -c Release

      - name: Download the models
        if: needs.changes.outputs.code != 'false' && (steps.models.outputs.cache-hit != 'true')
        run: tools/ci-models.sh download en

      # A ready pull request runs the subset (level light, one shard); main and releases run everything in three.
      - name: Test
        if: needs.changes.outputs.code != 'false'
        run: |
          any() { printf 'FullyQualifiedName~%s|' $1 | sed 's/|$//'; }
          none() { printf 'FullyQualifiedName!~%s&' $1 | sed 's/&$//'; }
          case ${{ matrix.shard }} in 1) filter=$(none "$SHARD_TWO $SHARD_THREE $SHARD_FOUR");; 2) filter=$(any "$SHARD_TWO");; 3) filter=$(any "$SHARD_THREE");; esac
          if [ "${{ needs.changes.outputs.level }}" = light ]; then
            filter='FullyQualifiedName~PipelineTests|FullyQualifiedName~ManagedBackendTests|FullyQualifiedName~ManagedCheckTests'
          fi
          echo "$filter"
          # libtorch picks its float32 kernels by CPU (MKL's sgemm per ISA, ATen's avx2/avx512 kernels), so on an Intel
          # AVX-512 runner the TorchSharp backend drifted 1.2e-4 from Stanza where AMD drifts 6.1e-5 (German default_fast
          # UPOS logits near |285|; docs/performance/round-26-torchsharp-intel-drift.md). These two pick the same kernels on
          # every x64 CPU: results are bit-identical on all runners drawn. Test environment only; users keep the defaults.
          if [ "$RUNNER_ARCH" = X64 ]; then export ATEN_CPU_CAPABILITY=default MKL_CBWR=COMPATIBLE,STRICT; fi
          dotnet test StanzaSharp.slnx -c Release --no-build --blame-hang-timeout 30m --blame-hang-dump-type none --logger trx --results-directory TestResults --filter "$filter"

      - name: Check that no test was skipped
        if: needs.changes.outputs.code != 'false'
        run: |
          ls TestResults/*.trx
          # Run_PythonStanza_* needs Python Stanza, which this job doesn't install (golden-shard 2 runs them). German tests
          # (rows with lang "de", names with German) need the German models, and TreebankPackageTests', ModelChoiceTests' and OptionTests' English rows and CharlmInputTests the
          # English treebank and alternative models, which only golden-shard has, and the Transformer* classes the transformer files
          # golden-shard 4 downloads, and LanguageIdentifierTests and MultilingualPipelineTests the language identifier golden-shard 1 downloads.
          if grep -h 'outcome="NotExecuted"' TestResults/*.trx | grep -v 'Run_PythonStanza_' | grep -qvE 'lang: (&quot;|")de|German|TreebankPackageTests|ModelChoiceTests|OptionTests|CharlmInputTests|Transformer|LanguageIdentifierTests|MultilingualPipelineTests'; then
            echo "::error::Tests were skipped; the models in models/stanza/en were not found."
            exit 1
          fi
          if ! grep -q '<UnitTestResult ' TestResults/*.trx; then echo "::error::No test ran."; exit 1; fi

      # The package checks run in one shard per OS (3, the shortest on Windows) and never on light runs.
      # The TorchSharp backend as its users install it (StanzaSharp + TorchSharp-cpu). TorchSharp-cpu has no Windows Arm64
      # libtorch, so not there.
      - name: Verify the package
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.level != 'light' && matrix.shard == 3 && (runner.os != 'Windows' || runner.arch != 'ARM64')
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en

      # The default install: only StanzaSharp, no libtorch; the default (managed) backend must run without it.
      - name: Verify the package without libtorch (managed backend)
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.level != 'light' && matrix.shard == 3
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en -Managed

      # Native AOT and trimming on Windows x64 (tools/verify-aot.sh; the runner's VS 2022 has the C++ linker AOT needs).
      - name: Verify Native AOT and trimming
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.level != 'light' && matrix.shard == 3 && matrix.os == 'windows-2025'
        run: bash tools/verify-aot.sh models/stanza/en win-x64

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.code != 'false'
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: TestResults/*.trx

  # The checks branch protection requires, cross-os (<os>): each passes only if every shard of its OS passed. The needs
  # result covers all nine shards, so when it isn't success this asks the API for this run's shard jobs of its OS (each
  # job's latest attempt): a failure on one OS fails only that OS's check. No shard found fails too.
  cross-os:
    needs: cross-os-shard
    if: ${{ !cancelled() && inputs.golden_shards == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, windows-11-arm]
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "cross-os-shard: ${{ needs.cross-os-shard.result }}"
          if [ "${{ needs.cross-os-shard.result }}" = success ]; then exit 0; fi
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name | startswith("cross-os-shard (${{ matrix.os }},")) | "\(.name): \(.conclusion)"' > shards.txt
          cat shards.txt
          test -s shards.txt && ! grep -qv ': success$' shards.txt
