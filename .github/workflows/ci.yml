name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs the same checks before publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Build and the tests that need no model files (the model tests skip).
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      - name: Build
        run: dotnet build StanzaSharp.slnx

      - name: Test
        run: dotnet test StanzaSharp.slnx --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-build-test
          path: TestResults/*.trx

  # The full suite against Stanza's real English models, downloaded and converted with the pinned stanza version.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

      # ModelDownloader.cs pins the models (and their MD5s); the converter decides their converted form.
      # Both are kept: the .pt loader tests compare models/stanza/en with models/converted/en.
      - uses: actions/cache@v6
        id: models
        with:
          path: |
            models/stanza/en
            models/converted/en
          key: models-en-${{ hashFiles('src/StanzaSharp/ModelDownloader.cs', 'tools/requirements.txt', 'tools/stanza_convert.py') }}

      - name: Build
        run: dotnet build StanzaSharp.slnx

      # The library's own downloader, as users run it; Python is only needed for the converter.
      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          dotnet run --project samples/StanzaSharp.Cli --no-build -- download models/stanza/en
          dotnet run --project samples/StanzaSharp.Cli --no-build -- download models/stanza/en --package default_fast

      - uses: actions/setup-python@v7
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Convert the models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          # The CPU-only torch wheel; the default Linux wheel pulls in gigabytes of CUDA.
          pip install -r tools/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python tools/stanza_convert.py convert models/stanza/en --out models/converted/en

      - name: Test
        run: dotnet test StanzaSharp.slnx --no-build --logger trx --results-directory TestResults

      # A skipped test here means the models were not found.
      - name: Check that no test was skipped
        run: |
          ls TestResults/*.trx
          # Skipped tests are outcome="NotExecuted" (the Counters' notExecuted stays 0 for them).
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Tests were skipped; the models in models/stanza/en or models/converted/en were not found."
            exit 1
          fi

      # Pack, then build and run a fresh app that references the package as a user would.
      - name: Verify the package
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-golden
          path: TestResults/*.trx

  # Windows and macOS (Apple Silicon): the full suite and the package check against Stanza's .pt files.
  # golden stays the reference run; only it converts the models (Python) and compares .pt with converted.
  # A separate job, not a matrix over build-test/golden, so those two keep their check names (required on main).
  # No NuGet cache here: TorchSharp-cpu pulls all three libtorch builds, and the repository's 10 GB cache
  # budget goes to the models.
  cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Pipeline.Load and every test accept the .pt download directly.
      STANZASHARP_MODELS: ${{ github.workspace }}/models/stanza/en
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        id: models
        with:
          path: models/stanza/en
          key: models-pt-${{ runner.os }}-${{ hashFiles('src/StanzaSharp/ModelDownloader.cs') }}

      - name: Build
        run: dotnet build StanzaSharp.slnx

      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          dotnet run --project samples/StanzaSharp.Cli --no-build -- download models/stanza/en
          dotnet run --project samples/StanzaSharp.Cli --no-build -- download models/stanza/en --package default_fast

      - name: Test
        run: dotnet test StanzaSharp.slnx --no-build --logger trx --results-directory TestResults

      - name: Check that no test was skipped
        run: |
          ls TestResults/*.trx
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Tests were skipped; the models in models/stanza/en were not found."
            exit 1
          fi

      # Temporary: why libLibTorchSharp.dylib doesn't load on macOS (TorchSharp hides dlopen's error).
      - name: Diagnose native load (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          uname -m; sw_vers; dotnet --info | head -20
          dir=tests/StanzaSharp.Tests/bin/Debug/net10.0/cpu
          ls -la "$dir"
          for f in "$dir"/libLibTorchSharp.dylib "$dir"/libtorch_cpu.dylib; do echo "== $f"; file "$f"; otool -L "$f"; otool -l "$f" | grep -A3 -E "LC_RPATH|LC_BUILD_VERSION" | head -20; done
          python3 -c "import ctypes,sys; ctypes.CDLL(sys.argv[1])" "$dir/libLibTorchSharp.dylib" && echo "python dlopen OK"

      - name: Verify the package
        shell: pwsh
        run: ./tools/verify-package.ps1 -ModelDir models/stanza/en

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
